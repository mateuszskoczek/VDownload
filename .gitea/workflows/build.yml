name: Build app

on:
  push:
    branches:
      - "dev"
    paths:
      - "VDownload**"
  pull_request:
    branches:
      - "dev"
      - "main"
    paths:
      - "VDownload**"

jobs:
  build:
    name: Build
    runs-on: windows-11
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
          clean: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore